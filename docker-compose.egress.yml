# Egress override: выход агентов в интернет для LLM API.
# Подключает coordinator + rover к host-доступной сети edge.
#
#   docker compose -f docker-compose.yml -f docker-compose.city.yml \
#                  -f docker-compose.egress.yml up --build

services:
  coordinator: { networks: [mesh, edge] }
  rover:       { networks: [mesh, edge] }