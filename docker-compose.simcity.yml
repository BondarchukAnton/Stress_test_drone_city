# Overlay: 1 реальный дрон (bridge на хосте) + мок-ровер.
# Каждый дрон-агент управляет своим дроном через bridge URL (BRIDGE_URL).
#
# Использование:
#   export DRONE1_URL=http://host.docker.internal:9001
#   docker compose -f docker-compose.yml -f docker-compose.city.yml \
#                  -f docker-compose.egress.yml -f docker-compose.simcity.yml up -d --build

services:
  coordinator:
    networks: [mesh, edge]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - blackboard:/blackboard
      - ./test_fixtures:/app/test_fixtures:ro
    environment:
      TASK: city_missions
      SCENARIO: city-1
      SCOUTS: drone-1
      ROVER_URL: http://bridge-rover:9000
      KEEP_ALIVE: "1"

  drone-1:
    networks: [mesh, edge]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: scout
      AGENT_ID: drone-1

  rover:
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: rover

  hub:
    networks: [mesh, edge]
    volumes:
      - blackboard:/blackboard
    environment:
      SCENARIO: city-1
      TASK: city_missions