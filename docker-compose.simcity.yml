# Overlay: 1 реальный дрон (bridge на хосте) + мок-ровер.
# Координатор получает URL дронов для централизованного управления.
#
# Использование:
#   export DRONE1_URL=http://host.docker.internal:9001
#   docker compose -f docker-compose.yml -f docker-compose.city.yml \
#                  -f docker-compose.egress.yml -f docker-compose.simcity.yml up -d --build

services:
  coordinator:
    networks: [mesh, edge]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - blackboard:/blackboard
      - ./test_fixtures:/app/test_fixtures:ro
    environment:
      TASK: city_missions
      SCENARIO: city-1
      SCOUTS: drone-1
      HOVER_ALTITUDE: "${HOVER_ALTITUDE:-2.0}"
      DRONE1_URL: ${DRONE1_URL:-http://host.docker.internal:9001}
      DRONE2_URL: ""
      DRONE3_URL: ""
      DRONE4_URL: ""
      ROVER_URL: http://bridge-rover:9000

  drone-1:
    networks: [mesh, edge]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: scout
      BRIDGE_URL: ${DRONE1_URL:-http://host.docker.internal:9001}

  rover:
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: rover
      BRIDGE_URL: http://bridge-rover:9000

  hub:
    networks: [mesh, edge]
    volumes:
      - blackboard:/blackboard
    environment:
      SCENARIO: city-1
      TASK: city_missions