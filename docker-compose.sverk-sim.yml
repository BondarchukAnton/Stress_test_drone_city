# Overlay: симулятор — агенты в Docker подключаются к ROS2 симулятора на хосте.
#
# Каждый drone-агент запускает sverk_interfaces.init() внутри контейнера.
# ROS2 discovery через host-сеть + ROS_DOMAIN_ID.
#
# На хосте должен быть запущен симулятор с ROS2 (PX4 SITL + Gazebo).
#
#   docker compose -f docker-compose.yml -f docker-compose.city.yml \
#                  -f docker-compose.egress.yml -f docker-compose.sverk-sim.yml up -d --build

services:
  drone-1:
    network_mode: host
    depends_on: []
    volumes: ["./blackboard:/blackboard", "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: scout
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      AGENT_ID: drone-1

  drone-2:
    network_mode: host
    depends_on: []
    volumes: ["./blackboard:/blackboard", "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: scout
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      AGENT_ID: drone-2

  drone-3:
    network_mode: host
    depends_on: []
    volumes: ["./blackboard:/blackboard", "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: scout
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      AGENT_ID: drone-3

  drone-4:
    network_mode: host
    depends_on: []
    volumes: ["./blackboard:/blackboard", "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: scout
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      AGENT_ID: drone-4

  coordinator:
    network_mode: host
    volumes: ["./blackboard:/blackboard", "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      SCOUTS: drone-1,drone-2,drone-3,drone-4
      ROVER_URL: "${ROVER_URL:-}"
      ROVER_API_URL: "${ROVER_API_URL:-}"
      KEEP_ALIVE: "1"

  rover:
    network_mode: host
    volumes: ["./blackboard:/blackboard", "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: rover
      ROVER_URL: "${ROVER_URL:-}"
      ROVER_API_URL: "${ROVER_API_URL:-}"

  hub:
    network_mode: host
    volumes: ["./blackboard:/blackboard"]
    environment:
      SCENARIO: city-1
      TASK: city_missions
      PORT: "8095"
      VIZ_HOST_PORT: "${VIZ_HOST_PORT:-8095}"