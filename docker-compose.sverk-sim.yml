# Overlay: симулятор — drone-агенты на хосте, coordinator+hub в Docker.
#
# Симулятор запускается отдельно с docker-compose.sim.hostnet.yml
# (network_mode: host, чтобы DDS был виден хосту).
#
# Drone-агенты запускаются прямо на хосте скриптом city_sverk_sim.sh.
#
#   docker compose -f docker-compose.yml -f docker-compose.city.yml \
#                  -f docker-compose.egress.yml \
#                  -f docker-compose.sverk-sim.yml up -d

services:
  coordinator:
    networks: [mesh, edge]
    volumes: ["./blackboard:/blackboard", "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      SCOUTS: drone-1,drone-2,drone-3,drone-4
      ROVER_URL: "${ROVER_URL:-}"
      ROVER_API_URL: "${ROVER_API_URL:-}"
      KEEP_ALIVE: "1"

  rover:
    networks: [mesh, edge]
    volumes: ["./blackboard:/blackboard", "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: rover
      ROVER_URL: "${ROVER_URL:-}"
      ROVER_API_URL: "${ROVER_API_URL:-}"

  hub:
    networks: [mesh, edge]
    ports: ["8095:8080"]
    volumes: ["./blackboard:/blackboard"]
    environment:
      SCENARIO: city-1
      TASK: city_missions
      PORT: "8080"