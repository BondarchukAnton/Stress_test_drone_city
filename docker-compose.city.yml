# Overlay: city_missions scenario (пожар + ровер в городе 6×6).
#
# Фазовый поток: CHAT_SCRIPT → EXECUTE_FLIGHT → CHAT_TARGET → ROVER_EXECUTE → DONE
# Координатор держит KEEP_ALIVE=1 чтобы контейнер не упал до завершения всех фаз.
#
#   docker compose -f docker-compose.yml -f docker-compose.city.yml up --build
#
# С реальным LLM:
#   docker compose -f docker-compose.yml -f docker-compose.city.yml -f docker-compose.egress.yml up --build

services:
  coordinator:
    networks: [mesh, edge]
    volumes:
      - blackboard:/blackboard
      - ./test_fixtures:/app/test_fixtures:ro
    environment:
      TASK: city_missions
      SCENARIO: city-1
      SCOUTS: drone-1,drone-2,drone-3,drone-4
      ROVER_URL: "${ROVER_URL:-}"
      ROVER_API_URL: "${ROVER_API_URL:-}"
      KEEP_ALIVE: "1"
  drone-1:
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment: { TASK: city_missions, SCENARIO: city-1, ROLE: scout, AGENT_ID: drone-1 }
  drone-2:
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment: { TASK: city_missions, SCENARIO: city-1, ROLE: scout, AGENT_ID: drone-2 }
  drone-3:
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment: { TASK: city_missions, SCENARIO: city-1, ROLE: scout, AGENT_ID: drone-3 }
  drone-4:
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment: { TASK: city_missions, SCENARIO: city-1, ROLE: scout, AGENT_ID: drone-4 }
  rover:
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: rover
      ROVER_URL: "${ROVER_URL:-}"
      ROVER_API_URL: "${ROVER_API_URL:-}"
  hub:
    networks: [mesh, edge]
    volumes:
      - blackboard:/blackboard
    environment:
      SCENARIO: city-1
      TASK: city_missions