# Overlay: city_missions scenario (пожар + ровер в городе 6×6).
#
# Агенты обсуждают план в чате, затем координатор запускает
# city_mission.py, который управляет всеми дронами через мосты.
#
#   docker compose -f docker-compose.yml -f docker-compose.city.yml up --build
#
# С реальным LLM:
#   docker compose -f docker-compose.yml -f docker-compose.city.yml -f docker-compose.egress.yml up --build

services:
  coordinator:
    networks: [mesh, edge]
    volumes:
      - blackboard:/blackboard
      - ./test_fixtures:/app/test_fixtures:ro
    environment:
      TASK: city_missions
      SCENARIO: city-1
      SCOUTS: drone-1,drone-2,drone-3,drone-4
      HOVER_ALTITUDE: "${HOVER_ALTITUDE:-2.0}"
      DRONE1_URL: http://bridge-drone-1:9000
      DRONE2_URL: http://bridge-drone-2:9000
      DRONE3_URL: http://bridge-drone-3:9000
      DRONE4_URL: http://bridge-drone-4:9000
      ROVER_URL: http://bridge-rover:9000
  drone-1:
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment: { TASK: city_missions, SCENARIO: city-1, ROLE: scout }
  drone-2:
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment: { TASK: city_missions, SCENARIO: city-1, ROLE: scout }
  drone-3:
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment: { TASK: city_missions, SCENARIO: city-1, ROLE: scout }
  drone-4:
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment: { TASK: city_missions, SCENARIO: city-1, ROLE: scout }
  rover:
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: rover
      BRIDGE_URL: http://bridge-rover:9000
  hub:
    networks: [mesh, edge]
    volumes:
      - blackboard:/blackboard
    environment:
      SCENARIO: city-1
      TASK: city_missions