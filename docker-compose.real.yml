# Overlay: реальные дроны.
#
# Каждый агент дрона использует sverk_interfaces (USE_SVERK=1) для прямого
# управления полётом через ArUco. Мок-мосты не запускаются.
#
# Использование:
#   docker compose -f docker-compose.yml -f docker-compose.city.yml \
#                  -f docker-compose.egress.yml -f docker-compose.real.yml up -d

services:
  bridge-rover: { profiles: [mock] }

  coordinator:
    depends_on: []
    networks: [mesh, edge]
    volumes:
      - blackboard:/blackboard
      - ./test_fixtures:/app/test_fixtures:ro
    environment:
      TASK: city_missions
      SCENARIO: city-1
      SCOUTS: drone-1,drone-2,drone-3,drone-4
      ROVER_URL: ${ROVER_URL}
      ROVER_API_URL: ${ROVER_API_URL:-}
      KEEP_ALIVE: "1"

  drone-1:
    depends_on: []
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: scout
      AGENT_ID: drone-1
  drone-2:
    depends_on: []
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: scout
      AGENT_ID: drone-2
  drone-3:
    depends_on: []
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: scout
      AGENT_ID: drone-3
  drone-4:
    depends_on: []
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: scout
      AGENT_ID: drone-4
  rover:
    depends_on: []
    networks: [mesh, edge]
    volumes: [blackboard:/blackboard, "./test_fixtures:/app/test_fixtures:ro"]
    environment:
      TASK: city_missions
      SCENARIO: city-1
      ROLE: rover

  hub:
    networks: [mesh, edge]
    volumes:
      - blackboard:/blackboard
    environment:
      SCENARIO: city-1
      TASK: city_missions