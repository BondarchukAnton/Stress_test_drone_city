# site.yml

- name: Deploy on Raspberry Pi
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install dependencies
      apt:
        name:
          - python3
          - python3-pip
        state: present

    - name: Copy files to remote host
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      with_items:
        - { src: "../agent/", dest: "/home/pi/agent" }
        - { src: "../bridge/", dest: "/home/pi/bridge" }
        - { src: "../hub/", dest: "/home/pi/hub" }
        - { src: "../onboard/", dest: "/home/pi/onboard" }

    - name: Install Python dependencies
      pip:
        requirements: /home/pi/agent/requirements.txt

    - name: Start services
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      with_items:
        - agent_loop
        - bridge_node
        - hub_server
