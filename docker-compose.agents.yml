# docker-compose.agents.yml

version: '3.8'

services:
  agent_loop:
    build: ./agent
    volumes:
      - ./agent:/app
    command: python loop.py

  bridge_node:
    build: ./bridge/ros2
    volumes:
      - ./bridge/ros2:/app
    command: python bridge_node.py

  hub_server:
    build: ./hub
    volumes:
      - ./hub:/app
    ports:
      - "5000:5000"
